server:
  port: 8000 # Porta que o Gateway vai rodar

app:
  security:
    internal-audit-token: ${AUDITORIA_INTERNAL_TOKEN:f1e2d3c4b5a6-audit-9988776655}

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      # Descoberta automática de rotas via Eureka também fica habilitada (lb://<service-id>)
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # IAM Service (auth + usuários) — resolvido via Eureka
        - id: iam-service-auth
          uri: lb://iam-service
          predicates:
            - Path=/api/auth/**
        - id: iam-service-usuarios
          uri: lb://iam-service
          predicates:
            - Path=/api/usuarios/**

        # Paciente Service
        - id: paciente-service
          uri: lb://paciente-service
          predicates:
            - Path=/api/pacientes/**

        # Catálogo Service (setores, leitos, convênios, medicamentos, TUSS, CID-10 + agregados)
        - id: catalogo-service
          uri: lb://catalogo-service
          predicates:
            - Path=/api/setores/**,/api/leitos/**,/api/convenios/**,/api/medicamentos/**,/api/procedimentos-tuss/**,/api/cid10/**,/api/catalogos/**

        # Agendamento Service
        - id: agendamento-service
          uri: lb://agendamento-service
          predicates:
            - Path=/api/agendamentos/**

        # Faturamento Service
        - id: faturamento-service
          uri: lb://faturamento-service
          predicates:
            - Path=/api/contas/**,/api/guias-tiss/**

        # Dashboard Service (agregador)
        - id: dashboard-service
          uri: lb://dashboard-service
          predicates:
            - Path=/api/dashboards/**

        # Auditoria Service (leitura da trilha)
        - id: auditoria-service
          uri: lb://auditoria-service
          predicates:
            - Path=/api/auditoria/**

        # Atendimento Service (Onda 5, primeira fatia) — só a fila/status/leito/alta do
        # PRÓPRIO atendimento. Os subrecursos clínicos aninhados (/api/atendimentos/{id}/
        # anamnese|diagnosticos|sinais-vitais|evolucoes|prescricoes|exames) NÃO batem
        # nesse predicate (Path com {id} casa só um segmento) e continuam caindo no
        # monolito-route abaixo — esses domínios ainda não foram extraídos.
        - id: atendimento-service
          uri: lb://atendimento-service
          predicates:
            - Path=/api/atendimentos,/api/atendimentos/{id},/api/atendimentos/{id}/status,/api/atendimentos/{id}/leito,/api/atendimentos/{id}/alta

        # Triagem Service (Onda 5, segunda fatia)
        - id: triagem-service
          uri: lb://triagem-service
          predicates:
            - Path=/api/atendimentos/{atendimentoId}/triagem

        # Sinais Vitais Service (Onda 5, terceira fatia)
        - id: sinais-vitais-service
          uri: lb://sinais-vitais-service
          predicates:
            - Path=/api/atendimentos/{atendimentoId}/sinais-vitais

        # Evolução Clínica Service (Onda 5, quarta fatia)
        - id: evolucao-service
          uri: lb://evolucao-service
          predicates:
            - Path=/api/atendimentos/{atendimentoId}/evolucoes

        # Rota padrão: tudo o mais ainda vai para o Monólito (porta 8080)
        - id: monolito-route
          uri: http://localhost:8080
          predicates:
            - Path=/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
